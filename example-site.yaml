# wpfreeze site configuration -- one file per target site.
# Copy this file, fill in the values for your site, and run:
#   wpfreeze acquire your-site
#   wpfreeze acquire --config your-site.yaml   (--config still works too)

# Optional. Short handle for this project -- every command can take it in
# place of --config: `wpfreeze build example-com`. Letters, digits, dash,
# underscore, dot only -- no slashes. Also the default basename the wizard
# suggests for output_dir below and for this file's own name. Omit this key
# entirely to fall back to the config filename's stem (no migration needed
# for an existing config).
name: example-com

# The site's root URL. Must be reachable; wpfreeze probes it once at
# startup to learn whether it serves https, whether it prefers www or
# non-www, and whether it prefers a trailing slash on directory-like URLs.
base_url: "https://example.com/"

# Working directory for this site's acquisition. wpfreeze creates:
#   raw/            fetched files, byte-for-byte as retrieved
#   manifest.json   the spine -- one record per canonical resource
#   report.html     single self-contained static report
#   report.json     the manifest plus summary statistics
#   logs/           run logs
output_dir: "./output/example-com"

# Seconds between requests to the *same host*, enforced globally across
# all workers regardless of `concurrency` (see below). If you start
# getting throttled or banned, raise this -- don't touch concurrency.
rate_limit: 1.0

# Seconds between requests to web.archive.org specifically. The Wayback
# Machine throttles aggressively and bans impolite clients; keep this
# slower than rate_limit.
wayback_rate_limit: 3.0

# Worker count. Concurrency parallelizes across different hosts (e.g. the
# main site plus a CDN extra_host); it does not multiply the per-host
# rate_limit above.
concurrency: 2

# URL regex patterns to exclude from archiving. Matches are recorded as
# `excluded` in the manifest -- never silently dropped. The defaults below
# cover standard WordPress noise; add site-specific patterns as needed.
# Category, tag, author, and date archives are intentionally NOT excluded
# here -- they're kept, including their pagination.
exclusions:
  - '\?replytocom='            # comment reply permutations
  - '/feed/?$'                 # feeds
  - '/comments/feed'           # comment feeds
  - '/feed/(rss2?|atom|rdf)/?$'  # feed format variants
  - '\?s='                     # search query strings
  - '/search/'                 # search results pages
  - '/wp-json/'                # REST API endpoints (used for inventory, not archived as pages)
  - '/wp-admin/'                # admin area
  - '/wp-login'                 # login page
  - '/xmlrpc\.php'              # XML-RPC endpoint
  - '/comment-page-\d+/'        # paginated comments
  # Common calendar/events-plugin expansions (e.g. The Events Calendar's
  # tribe-events month/day views) -- uncomment/add patterns matching your
  # site's actual plugin if it generates large numbers of these:
  # - '/events/\d{4}-\d{2}(-\d{2})?/'

# Additional hostnames to treat as internal (e.g. a CDN subdomain serving
# this site's uploads). Renderable resources on these hosts are localized
# the same as the main site's own assets.
extra_hosts: []
# extra_hosts:
#   - "cdn.example.com"

# Override the default identifying user-agent if needed. Keep it polite
# and identifying -- this is the site owner archiving their own site.
user_agent: "wpfreeze/0.1 (+https://example.invalid/wpfreeze-contact)"

wayback:
  enabled: true
  # Date (YYYY-MM-DD) to prefer snapshots nearest to, when a page needs
  # Wayback recovery. Defaults to today (most recent available) if unset.
  prefer_snapshots_near: "2026-01-01"

# Optional. What `wpfreeze freeze` runs, and in what order -- omit this
# whole block to accept the default shown below. `freeze` never infers a
# step from another config key (e.g. it does NOT run `upload-script` just
# because `upload.remote` is set below) -- only what's listed here runs.
# Permitted values: acquire, build, validate, diagnose, report, checklinks,
# search-index, upload-script. `checklinks` is deliberately not in the
# default list (it hits third-party hosts and is slow) -- `freeze` offers
# to run it at the end of the sequence instead; list it here explicitly if
# you always want it as a declared step.
freeze:
  steps: [acquire, build, validate]
  # true makes freeze behave in a real terminal exactly as it does when
  # piped: it never asks a question -- no resume confirmation, no
  # end-of-run checklinks offer. For a fully hands-off run, set this and
  # add `checklinks` to steps above.
  unattended: false

# Content policy for `wpfreeze build` -- what to strip when turning the raw
# capture into a servable static site. All three default to true: the point
# of a build is a durable, self-contained archive, and live-web machinery
# works against that. This whole block is optional; omit it to accept the
# defaults below.
policy:
  # Remove analytics and tag-manager machinery so the archive never phones
  # home. Covers third-party trackers by host (Google Analytics/Tag Manager,
  # Meta Pixel, Hotjar, Matomo, WordPress.com/Jetpack stats, and more) AND
  # the analytics *plugins* self-hosted WordPress serves from its own domain
  # (MonsterInsights, Site Kit, Analytify, self-hosted Matomo), which a
  # host-based rule cannot see. External references, tracking pixels, the
  # <noscript> tag-manager iframe, and dedicated inline tracking <script>
  # blocks are all removed. Every removal is counted in the build summary.
  strip_telemetry: true

  # Remove <form> elements. On a static archive none of them submit usefully:
  # comment and search forms hit endpoints that no longer exist, and mailing-
  # list forms silently hand a reader's email to a third party while looking
  # like they work. The form is removed outright, not disabled in place.
  # A WordPress core comment form specifically -- detected by its
  # id="respond"/class="comment-respond" wrapper, not by caption text, so a
  # themed "Submit a Comment" is caught exactly like the default "Leave a
  # Reply" -- has its whole wrapper removed as one unit (heading, "Cancel
  # reply" link, form), not just the <form>. Any in-page link left pointing
  # at that removed id elsewhere on the page (WordPress's own "N comments"
  # post-meta link) is also fixed; see strip_comment_counts below for what
  # happens to the "N comments" text itself. Categorized in the cleanup
  # checklist's "Content intentionally excised" section as "comment",
  # "search" (see strip_search_forms below), or "other" (subscribe,
  # contact, unrecognized).
  strip_forms: true

  # Only meaningful when strip_forms removes a comment form's wrapper. True
  # (default) removes the "N comments" post-meta blurb outright, regardless
  # of count -- matches strip_forms's own "no live-web machinery" stance.
  # False keeps it as plain text for any page with a nonzero count (the
  # comment thread, if captured, is still real content someone may want the
  # count for); a "0 comments" blurb is still removed either way, since it's
  # noise, not information. The dead #respond link itself is always fixed,
  # regardless of this setting.
  strip_comment_counts: true

  # Only meaningful when strip_forms would remove a recognized search form
  # (role="search", or a name="s" input -- WordPress's own conventions,
  # theme-independent). True (default) removes it like any other form.
  # False leaves it completely untouched, for a site owner planning to
  # wire up a replacement rather than just lose search entirely -- pages
  # with one left this way are listed in the cleanup checklist's "Search
  # forms left in place" section. This does NOT make the form functional
  # on its own: its action attribute still gets rewritten like any other
  # reference, so submitting it as-is just navigates to the local homepage
  # with an ignored ?s= query string. It's raw material to repurpose --
  # unless you also turn on `search:` below, in which case `build` does
  # the wiring itself. NOTE: load_config only supplies its own false
  # default here when this key is absent from the config entirely -- this
  # file spells it out as `true`, so if you copy this file wholesale and
  # then enable `search:` below, flip this line (or delete it) yourself.
  strip_search_forms: true

  # Remove feed links -- the <link rel="alternate" type="application/rss+xml">
  # (and Atom/RDF) pointers in the document head, which reference endpoints
  # that die with the live site. Visible "Subscribe via RSS" links in page
  # body content are left alone; those are content, not dead metadata.
  strip_feeds: true

  # Remove WordPress protocol-discovery <link> tags in the document head --
  # pingback/EditURI (xmlrpc.php), the REST API self-discovery links
  # (api.w.org, alternate/application+json), oEmbed discovery, and the
  # ?p=<id> shortlink. None are rendered or used by a browser; all require
  # a live PHP backend a static archive doesn't have. rel="canonical" is a
  # genuine self-reference and is left alone.
  strip_wp_meta_links: true

  # Unwrap WordPress login/admin links -- wp-login.php, /wp-admin/, and
  # WordPress.com's hosted /log-in endpoint. Nobody can log in to a static
  # copy, and following one sends a visitor to the live site's login
  # screen. Unwrapped, not deleted: the visible text stays, only the dead
  # destination goes. A WordPress.com theme puts a "Log in" link on every
  # page, each with its own ?redirect_to= query, so they don't dedupe --
  # on one real 248-page site that was 228 distinct external URLs and 66%
  # of everything checklinks called broken, all bot-protection 403s.
  strip_login_links: true

  # Lift <style> blocks that are byte-identical across many pages into a
  # single shared stylesheet, linked from each page instead of repeated
  # inline. Not a strip -- nothing is removed, the same CSS is just served
  # from one place instead of hundreds. Only kicks in once the redundancy
  # crosses a size threshold; small or page-specific blocks stay inline.
  dedupe_inline_css: true

  # Add site-specific tracker hostnames to the built-in blocklist, for a
  # tracker this list doesn't already know. Matched as a substring of the
  # reference's host, so "analytics.example.com" covers its subdomains.
  telemetry_extra_hosts: []
  #   - "analytics.example.com"

  # Escape hatch: hostnames to NEVER strip, even if they would otherwise
  # match. Use if a "tracker" host actually serves something you need kept.
  telemetry_keep_hosts: []

# Optional. Path to a WordPress XML export (Tools > Export > All content
# in wp-admin, or `wp export` via WP-CLI -- a "WXR" file) for this site.
# If you have one, it augments the sitemap and REST API inventory with a
# ground-truth source immune to plugins that hide content from both -- but
# it's a normal optional key like wayback/extra_hosts above: omit it
# entirely if you don't have one, nothing forces a decision either way.
# xml_backup: "./site-export.WordPress.xml"

# Optional. Path to a vnu.jar (the Nu Html Checker), used by
# `wpfreeze validate` to check the built site's HTML/CSS. Omit this key
# entirely to have `validate` auto-download and cache the latest release
# itself -- only set it to pin a specific jar (e.g. for reproducibility,
# or on a machine without network access to GitHub).
vnu_jar: "./vnu.jar"

# Optional. Destinations for `wpfreeze upload-script`, which writes
# upload.sh -- one script covering three modes (see "Previewing a build
# somewhere" in the README for the full walkthrough):
#   ./upload.sh          sync site + reports (cleanup-todo.html,
#                         report.html, broken-external-links.html) to
#                         `remote` below -- a staging/preview copy.
#   ./upload.sh --local  assemble the same bundle under <output_dir>/
#                         preview/, no network -- for browsing off disk.
#   ./upload.sh --prod   sync the site *only* (no reports) to `prod_remote`
#                         below, after a y/N confirmation prompt -- the one
#                         mode meant for the real, live site.
# Both remotes are independent -- set either, both, or neither. Either mode
# that needs a remote errors clearly at run time if its own remote isn't
# set; `--local` needs neither. The staging and prod modes both use
# `rsync -av --delete`, so anything already at that destination that isn't
# part of this build gets deleted, not just overwritten. Generating (and
# separately, running) the script is always something you do on purpose;
# `build` never touches this and never runs it.
# upload:
#   remote: "user@host:/path/to/staging"
#   prod_remote: "user@host:/path/to/production"

# Optional. Gives the archived site a working search box again --
# `wpfreeze build` indexes the site with Pagefind and wires the theme's
# own existing search form to the local index, with no new visible UI
# and no server. Needs the `pagefind` package (`pipx inject wpfreeze
# 'pagefind[extended]'` for a pipx install) and requires the search form
# to actually survive the build. If your config leaves strip_search_forms
# unset, load_config defaults it to false for you the moment enabled: true
# is set here -- but this file spells strip_search_forms out explicitly
# above (see its own comment), so flip it to `false` yourself if you copy
# this template wholesale. An *explicit* `strip_search_forms: true` (or
# `strip_forms: true`) alongside `enabled: true` here is a genuine
# contradiction and still makes wpfreeze refuse to start with a
# ConfigError, rather than silently building a site with nothing to wire
# up. See "Offline search" in README.md for the full picture, including
# why body_selectors is worth reading carefully before you set it.
# search:
#   enabled: false
#
#   CSS selectors marking where a page's REAL content lives. This does
#   two things, and the second is the one worth reading carefully: it
#   narrows what Pagefind indexes on a matching page, AND it means any
#   page matching NONE of the selectors is dropped from the index
#   entirely (Pagefind's own behaviour, not something wpfreeze adds).
#   That's deliberate -- it's the only way to keep category/tag archives
#   and attachment pages out of search results -- but a too-narrow
#   selector silently empties part of the index. The build reports the
#   miss count and the cleanup checklist lists every affected page, so
#   this doesn't fail silently.
#
#   Omitting this key entirely (as below) defaults to
#   ["body.wp-singular .entry-content"] -- WordPress core's own
#   singular/archive distinction plus its content wrapper, which most
#   non-page-builder themes follow. Set body_selectors: [] explicitly to
#   opt back into indexing the whole <body> of every page instead (every
#   result then carries the theme's nav/sidebar/footer text, and archive
#   pages compete with real content in results). See "Offline search" in
#   README.md for why this default exists.
#   # body_selectors defaults to ["body.wp-singular .entry-content"]
#
#   CSS selectors to exclude from indexing even inside otherwise-indexed
#   content -- a repeated "related posts" widget, say.
#   ignore_selectors: []
#
#   Collapses Pagefind's per-<html lang> index split into a single index.
#   Needed if the theme is inconsistent about emitting `lang` on every
#   page, which otherwise silently returns no results from whichever
#   pages fell into the un-forced index. e.g. "en".
#   force_language: null
#
#   Exact output paths to drop from the index outright (e.g.
#   ["/blog.html"] -- not a URL, not a glob), for pages body_selectors
#   can't exclude: a hand-built page-builder "archive" page is often
#   structurally identical to a real content page (same body/entry-
#   content classes), so the selector can't tell them apart. `build`
#   reports exactly these pages under "Pages that mostly duplicate other
#   pages" if left indexed -- paste their paths here.
#   exclude_pages: []
#
#   Exact output paths of pages already reviewed and confirmed
#   legitimately short by design (a single-image portfolio item, a
#   glossary entry) rather than broken or truncated. Unlike
#   exclude_pages, an acknowledged page stays indexed and searchable --
#   only the cleanup checklist's "needs a look" push for it is
#   suppressed. Still listed every build under its own "Acknowledged"
#   heading, never silently dropped from the report.
#   acknowledged_thin_pages: []
#
#   Suppresses `build`'s pushback when this capture has no search form at
#   all to wire up (an index would otherwise get built with nothing on
#   the site able to reach it) -- no warning, no "build anyway?" prompt.
#   Set this only once you've confirmed that's expected (e.g. you're
#   planning to add a search box to the template by hand later).
#   acknowledged_no_forms: false
