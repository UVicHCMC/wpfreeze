[project]
name = "wpfreeze"
version = "0.1.0"
description = "Acquires a complete, verified local copy of a WordPress site's pages and assets, with Wayback Machine recovery for missing content."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Greg Newton" }]
requires-python = ">=3.12"
dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "html5lib",
    "PyYAML",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.optional-dependencies]
search = ["pagefind[extended]"]

[project.scripts]
wpfreeze = "wpfreeze.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wpfreeze*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
